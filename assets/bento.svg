    <rect x="20" y="0" width="90" height="2.5" rx="1.25" fill="#a78bfa" />

    <!-- Icon Box -->
    <rect x="20" y="20" width="38" height="38" rx="9" fill="#1e153a" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.5" />
    <path d="M 39 27 L 42 35 L 50 38 L 42 41 L 39 49 L 36 41 L 28 38 L 36 35 Z" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linejoin="round" />

    <!-- Title & Subtitle -->
    <text x="68" y="36" class="font-sans" font-size="15.5" font-weight="700" fill="#f8fafc">AI &amp; Automation</text>
    <text x="68" y="53" class="font-mono" font-size="11" font-weight="600" fill="#a78bfa">Python • LLMs • Pipelines</text>

    <line x1="20" y1="72" x2="268" y2="72" stroke="#1e293b" stroke-width="1" />

