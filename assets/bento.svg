    <g transform="translate(20, 202)">
      <rect x="0" y="0" width="52" height="24" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <text x="26" y="15.5" text-anchor="middle" class="font-mono" font-size="10.5" fill="#a78bfa">Python</text>

      <rect x="58" y="0" width="44" height="24" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <text x="80" y="15.5" text-anchor="middle" class="font-mono" font-size="10.5" fill="#a78bfa">LLMs</text>

      <rect x="108" y="0" width="74" height="24" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <text x="145" y="15.5" text-anchor="middle" class="font-mono" font-size="10.5" fill="#a78bfa">Playwright</text>

      <rect x="188" y="0" width="56" height="24" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <text x="216" y="15.5" text-anchor="middle" class="font-mono" font-size="10.5" fill="#a78bfa">FFmpeg</text>
