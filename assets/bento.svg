    <text x="34" y="125" class="font-sans" font-size="11.5" fill="#cbd5e1">DataForSEO, SerpAPI &amp; Firecrawl ops</text>

    <circle cx="24" cy="147" r="2.5" fill="#a78bfa" />
    <text x="34" y="151" class="font-sans" font-size="11.5" fill="#cbd5e1">Playwright QA gates &amp; auto DNS/SSL</text>

    <circle cx="24" cy="173" r="2.5" fill="#a78bfa" />
    <text x="34" y="177" class="font-sans" font-size="11.5" fill="#cbd5e1">Python video &amp; voice render engines</text>

