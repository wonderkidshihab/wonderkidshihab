    <text x="34" y="125" class="font-sans" font-size="11.5" fill="#cbd5e1">Healthcare &amp; e-commerce (My-Pharma)</text>

    <circle cx="24" cy="147" r="2.5" fill="#34d399" />
    <text x="34" y="151" class="font-sans" font-size="11.5" fill="#cbd5e1">High-speed SSR &amp; Astro SSG engines</text>

    <circle cx="24" cy="173" r="2.5" fill="#34d399" />
    <text x="34" y="177" class="font-sans" font-size="11.5" fill="#cbd5e1">Docker, Dokploy &amp; Cloudflare Pages</text>

    <!-- Bottom Tech Pills -->
    <g transform="translate(20, 202)">
      <rect x="0" y="0" width="56" height="24" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <text x="28" y="15.5" text-anchor="middle" class="font-mono" font-size="10.5" fill="#34d399">Next.js</text>

      <rect x="62" y="0" width="52" height="24" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <text x="88" y="15.5" text-anchor="middle" class="font-mono" font-size="10.5" fill="#34d399">Django</text>

      <rect x="120" y="0" width="48" height="24" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <text x="144" y="15.5" text-anchor="middle" class="font-mono" font-size="10.5" fill="#34d399">Astro</text>

      <rect x="174" y="0" width="70" height="24" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <text x="209" y="15.5" text-anchor="middle" class="font-mono" font-size="10.5" fill="#34d399">Supabase</text>
